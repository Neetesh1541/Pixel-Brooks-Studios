<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgHack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a12"/>
      <stop offset="0.5" stop-color="#1b1030"/>
      <stop offset="1" stop-color="#3b1a5c"/>
    </linearGradient>
    <linearGradient id="accentHack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b5cff"/>
      <stop offset="1" stop-color="#00e5c7"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bgHack)"/>
  <g opacity="0.3">
    <circle cx="1400" cy="150" r="280" fill="#7b5cff" opacity="0.25"/>
    <circle cx="150" cy="880" r="260" fill="#00e5c7" opacity="0.16"/>
  </g>
  <!-- grid dots -->
  <g opacity="0.15">
    <path d="M0 0h1600M0 100h1600M0 200h1600M0 300h1600M0 400h1600M0 500h1600M0 600h1600M0 700h1600M0 800h1600M0 900h1600" stroke="#ffffff" stroke-width="1"/>
  </g>
  <!-- browser chrome -->
  <rect x="110" y="110" width="1380" height="780" rx="28" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="165" cy="165" r="9" fill="#ff6b6b" opacity="0.8"/>
  <circle cx="195" cy="165" r="9" fill="#ffd166" opacity="0.8"/>
  <circle cx="225" cy="165" r="9" fill="#5fd68a" opacity="0.8"/>
  <rect x="270" y="150" width="620" height="30" rx="15" fill="#ffffff" fill-opacity="0.1"/>
  <text x="290" y="171" font-family="monospace" font-size="16" fill="#ffffff" fill-opacity="0.65">www.hackloop.me</text>

  <!-- terminal window -->
  <g transform="translate(260,260)">
    <rect x="0" y="0" width="620" height="330" rx="16" fill="#0e0e18" stroke="url(#accentHack)" stroke-width="2"/>
    <rect x="0" y="0" width="620" height="42" rx="16" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="26" cy="21" r="6" fill="#ff6b6b"/>
    <circle cx="48" cy="21" r="6" fill="#ffd166"/>
    <circle cx="70" cy="21" r="6" fill="#5fd68a"/>
    <text x="24" y="80" font-family="monospace" font-size="17" fill="#00e5c7">$ hackloop init community</text>
    <text x="24" y="112" font-family="monospace" font-size="17" fill="#ffffff" fill-opacity="0.8">&gt; connecting builders, devs &amp; hackers…</text>
    <text x="24" y="144" font-family="monospace" font-size="17" fill="#7b5cff">&gt; events: hackathons, meetups, workshops</text>
    <text x="24" y="176" font-family="monospace" font-size="17" fill="#ffffff" fill-opacity="0.8">&gt; members online: 1,204</text>
    <text x="24" y="208" font-family="monospace" font-size="17" fill="#00e5c7">&gt; status: ready to ship ✓</text>
    <rect x="24" y="240" width="14" height="24" fill="#00e5c7">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- code brackets emblem -->
  <g transform="translate(980,300)">
    <text x="0" y="140" font-family="monospace" font-size="200" font-weight="700" fill="url(#accentHack)" opacity="0.9">&lt;/&gt;</text>
  </g>
  <g transform="translate(980,470)">
    <rect x="0" y="0" width="360" height="60" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="20" y="37" font-family="Arial, sans-serif" font-size="17" fill="#ffffff" fill-opacity="0.85" font-weight="700">Community · Hackathons · Code</text>
  </g>

  <text x="150" y="960" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff">Hackloop</text>
</svg>
