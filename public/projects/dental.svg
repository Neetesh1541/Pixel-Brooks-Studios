    <text x="24" y="37" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" fill-opacity="0.9" font-weight="700">Gentle, modern dental care</text>
  </g>

  <!-- booking card -->
  <g transform="translate(780,260)">
    <rect x="0" y="0" width="500" height="440" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <text x="30" y="54" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Dr. Aakriti Patel</text>
    <text x="30" y="82" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" fill-opacity="0.6">BDS · Cosmetic &amp; Family Dentistry</text>
    <line x1="30" y1="104" x2="470" y2="104" stroke="#ffffff" stroke-opacity="0.15"/>
    <g font-family="Arial, sans-serif" font-size="15" fill="#ffffff" fill-opacity="0.85">
