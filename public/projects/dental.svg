  </defs>
  <rect width="1600" height="1000" fill="url(#bgDental)"/>
  <g opacity="0.25">
    <circle cx="1420" cy="180" r="280" fill="#5ecbe0" opacity="0.25"/>
    <circle cx="140" cy="860" r="260" fill="#ff8fa3" opacity="0.16"/>
  </g>
  <!-- browser chrome -->
  <rect x="110" y="110" width="1380" height="780" rx="28" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="165" cy="165" r="9" fill="#ff6b6b" opacity="0.8"/>
  <circle cx="195" cy="165" r="9" fill="#ffd166" opacity="0.8"/>
  <circle cx="225" cy="165" r="9" fill="#5fd68a" opacity="0.8"/>
  <rect x="270" y="150" width="700" height="30" rx="15" fill="#ffffff" fill-opacity="0.1"/>
  <text x="290" y="171" font-family="monospace" font-size="16" fill="#ffffff" fill-opacity="0.65">mydental-clinicc.netlify.app</text>

  <!-- tooth icon -->
  <g transform="translate(300,300)">
    <path d="M120 0c-38 0-58 22-70 22s-30-22-64-22C-45 0-60 45-58 90c2 45 22 70 34 130 8 42 14 70 34 70 22 0 20-46 34-46s12 46 34 46c20 0 26-28 34-70 12-60 32-85 34-130 2-45-13-90-46-90z" fill="#ffffff" fill-opacity="0.92" transform="translate(0,10) scale(1.05)"/>
    <circle cx="60" cy="90" r="10" fill="#5ecbe0" opacity="0.5"/>
  </g>
  <g transform="translate(300,540)">
