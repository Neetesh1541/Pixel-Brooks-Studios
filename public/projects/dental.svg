      <stop offset="0" stop-color="#0b1d33"/>
      <stop offset="0.55" stop-color="#123a5c"/>
      <stop offset="1" stop-color="#1f7a8c"/>
    </linearGradient>
    <linearGradient id="accentDental" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ecbe0"/>
      <stop offset="1" stop-color="#ff8fa3"/>
