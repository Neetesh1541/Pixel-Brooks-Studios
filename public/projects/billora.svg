<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgBill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04231d"/>
      <stop offset="0.55" stop-color="#0a3f34"/>
      <stop offset="1" stop-color="#0f6b52"/>
    </linearGradient>
    <linearGradient id="accentBill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3a8"/>
      <stop offset="1" stop-color="#5fe6a8"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bgBill)"/>
  <g opacity="0.25">
    <circle cx="1420" cy="180" r="280" fill="#22d3a8" opacity="0.25"/>
    <circle cx="140" cy="860" r="260" fill="#5fe6a8" opacity="0.16"/>
  </g>
  <!-- browser chrome -->
  <rect x="110" y="110" width="1380" height="780" rx="28" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="165" cy="165" r="9" fill="#ff6b6b" opacity="0.8"/>
  <circle cx="195" cy="165" r="9" fill="#ffd166" opacity="0.8"/>
  <circle cx="225" cy="165" r="9" fill="#5fd68a" opacity="0.8"/>
  <rect x="270" y="150" width="700" height="30" rx="15" fill="#ffffff" fill-opacity="0.1"/>
  <text x="290" y="171" font-family="monospace" font-size="16" fill="#ffffff" fill-opacity="0.65">billora-sparkle.vercel.app</text>

  <!-- invoice card -->
  <g transform="translate(260,260)">
    <rect x="0" y="0" width="480" height="560" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <text x="32" y="56" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff">INVOICE</text>
    <text x="32" y="86" font-family="monospace" font-size="14" fill="#ffffff" fill-opacity="0.55">#BLR-2026-0042</text>
    <line x1="32" y1="110" x2="448" y2="110" stroke="#ffffff" stroke-opacity="0.15"/>
    <g font-family="Arial, sans-serif" font-size="14" fill="#ffffff" fill-opacity="0.7">
      <text x="32" y="150">Bill to: Sparkle Co.</text>
      <text x="32" y="174">Date: 12 Jul 2026</text>
    </g>
    <g font-family="Arial, sans-serif" font-size="14" fill="#ffffff">
      <rect x="32" y="200" width="416" height="34" fill="#ffffff" fill-opacity="0.08" rx="6"/>
      <text x="44" y="222" fill-opacity="0.6">Item</text>
      <text x="400" y="222" text-anchor="end" fill-opacity="0.6">Amount</text>
      <text x="44" y="266">Web design retainer</text>
      <text x="400" y="266" text-anchor="end">₹24,000</text>
      <text x="44" y="300">Hosting &amp; SSL</text>
      <text x="400" y="300" text-anchor="end">₹2,400</text>
      <text x="44" y="334">Automation setup</text>
      <text x="400" y="334" text-anchor="end">₹8,600</text>
    </g>
    <line x1="32" y1="366" x2="448" y2="366" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="32" y="404" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Total Due</text>
    <text x="448" y="404" text-anchor="end" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="url(#accentBill)">₹35,000</text>
    <rect x="32" y="440" width="180" height="46" rx="23" fill="url(#accentBill)"/>
    <text x="122" y="469" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#04231d">Paid ✓</text>
    <rect x="32" y="500" width="416" height="1" fill="#ffffff" fill-opacity="0.1"/>
    <text x="32" y="536" font-family="monospace" font-size="12" fill="#ffffff" fill-opacity="0.4">Generated instantly with Billora</text>
  </g>

  <!-- floating stat cards -->
  <g transform="translate(820,300)">
    <rect x="0" y="0" width="330" height="110" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="24" y="42" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.55">TOTAL INVOICED</text>
    <text x="24" y="82" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">₹4.2L</text>
  </g>
  <g transform="translate(820,440)">
    <rect x="0" y="0" width="330" height="110" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="24" y="42" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.55">AVG PAYMENT TIME</text>
    <text x="24" y="82" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="url(#accentBill)">2.1 days</text>
  </g>
  <g transform="translate(820,580)">
    <rect x="0" y="0" width="330" height="60" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="24" y="37" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" fill-opacity="0.85" font-weight="700">Fast, beautiful billing</text>
  </g>

  <text x="150" y="960" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff">Billora</text>
</svg>
