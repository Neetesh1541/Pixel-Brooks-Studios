<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgSchool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a3a"/>
      <stop offset="0.55" stop-color="#123a6b"/>
      <stop offset="1" stop-color="#1f6f7a"/>
    </linearGradient>
    <linearGradient id="cardSchool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="accentSchool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb6d9"/>
      <stop offset="1" stop-color="#e97b3a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bgSchool)"/>
  <g opacity="0.25">
    <circle cx="200" cy="150" r="260" fill="#3fb6d9" opacity="0.25"/>
    <circle cx="1450" cy="850" r="320" fill="#e97b3a" opacity="0.18"/>
  </g>
  <!-- browser chrome -->
  <rect x="110" y="110" width="1380" height="780" rx="28" fill="url(#cardSchool)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="165" cy="165" r="9" fill="#ff6b6b" opacity="0.8"/>
  <circle cx="195" cy="165" r="9" fill="#ffd166" opacity="0.8"/>
  <circle cx="225" cy="165" r="9" fill="#5fd68a" opacity="0.8"/>
  <rect x="270" y="150" width="620" height="30" rx="15" fill="#ffffff" fill-opacity="0.1"/>
  <text x="290" y="171" font-family="monospace" font-size="16" fill="#ffffff" fill-opacity="0.6">www.engineerscolonyschool.org</text>

  <!-- hero content: school building silhouette -->
  <g transform="translate(230,260)">
    <rect x="0" y="240" width="1140" height="14" rx="7" fill="url(#accentSchool)" opacity="0.7"/>
    <!-- building -->
    <g transform="translate(60,0)">
      <rect x="0" y="80" width="420" height="160" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
      <polygon points="-20,80 210,-10 440,80" fill="#3fb6d9" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
      <rect x="190" y="150" width="60" height="90" fill="#0b1a3a" fill-opacity="0.6"/>
      <rect x="30" y="120" width="45" height="45" fill="#ffd166" fill-opacity="0.55"/>
      <rect x="105" y="120" width="45" height="45" fill="#ffd166" fill-opacity="0.4"/>
      <rect x="270" y="120" width="45" height="45" fill="#ffd166" fill-opacity="0.4"/>
      <rect x="345" y="120" width="45" height="45" fill="#ffd166" fill-opacity="0.55"/>
      <rect x="195" y="-30" width="8" height="30" fill="#ffffff" fill-opacity="0.4"/>
      <circle cx="199" cy="-38" r="10" fill="#e97b3a" fill-opacity="0.7"/>
    </g>
    <!-- graduation cap icon -->
    <g transform="translate(560,60)">
      <polygon points="90,0 180,35 90,70 0,35" fill="#e97b3a" fill-opacity="0.8"/>
      <rect x="60" y="42" width="60" height="55" rx="8" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.35"/>
      <line x1="170" y1="35" x2="170" y2="85" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
      <circle cx="170" cy="90" r="6" fill="#ffd166"/>
    </g>
    <!-- cards: notice / academics / admissions -->
    <g transform="translate(560,160)">
      <rect x="0" y="0" width="270" height="70" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="20" y="30" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" fill-opacity="0.85" font-weight="700">Admissions Open</text>
      <text x="20" y="54" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.55">Session 2026-27 · Apply now</text>
    </g>
  </g>

  <text x="150" y="960" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff">Engineers Colony School</text>
</svg>
